[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polysolve"
authors = [{name = "Valeria Losasso", email = "valeria.losasso@stfc.ac.uk"}]
requires-python = ">= 3.8"
readme = "README.md"
description = ""
license = {text = "BSD-3-Clause"}

keywords = ["keyword"]
dependencies = ["numpy"]
classifiers = ["classifier"]
dynamic = ["version"]

[project.urls]
Homepage="https://github.com/valerialosasso/polysolve"
Repository="https://github.com/valerialosasso/polysolve.git"

[tool.setuptools.dynamic]
version = {attr = "polysolve.__version__"}
